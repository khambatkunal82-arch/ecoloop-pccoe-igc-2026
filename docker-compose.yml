services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecoloop
      POSTGRES_USER: ecoloop
      POSTGRES_PASSWORD: ecoloop
    volumes:
      - ecoloop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecoloop -d ecoloop"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ecoloop:ecoloop@db:5432/ecoloop
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
volumes:
  ecoloop_data:
